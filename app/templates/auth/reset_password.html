{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/email_features.css') }}?v=1">
<script src="{{ url_for('static', filename='js/password_toggle.js') }}?v=1" defer></script>

<div class="auth-page">
  <div class="auth-showcase" aria-hidden="true"><div class="auth-showcase-brand">✦ Learn with intention.</div>
    <div class="showcase-bottom"><span class="showcase-label">ACCOUNT SECURITY</span>
    <h2>Welcome back<br>to your journey.</h2><p>Choose a strong new password.</p></div>
  </div>
  <div class="auth-card">
    <div class="brand-box"><div class="brand-icon">AI</div><div><h1>EduMind AI</h1><p>Secure password reset</p></div></div>
    <h2>Choose a new password</h2>
    <p class="auth-subtitle">Enter a new password of at least 12 characters.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label for="new-password">New password</label>
        <div class="password-field"><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" class="form-control custom-input" required>
          <button type="button" class="password-toggle" data-toggle-password="new-password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
      <div class="mb-3"><label for="confirm-new-password">Confirm new password</label>
        <div class="password-field"><input id="confirm-new-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" class="form-control custom-input" required>
          <button type="button" class="password-toggle" data-toggle-password="confirm-new-password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
      <button class="btn primary-btn w-100" type="submit">Change password</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('auth.login') }}">← Back to login</a></p>
  </div>
</div>
{% endblock %}
