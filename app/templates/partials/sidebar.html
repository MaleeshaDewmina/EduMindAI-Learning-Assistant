<aside class="sidebar" id="app-sidebar" aria-label="Primary navigation">
    <div class="sidebar-logo">
        <div class="brand-icon small" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m4 15 5-9 3 5 4-7 4 11"/><path d="M4 19h16"/></svg></div>
        <div class="brand-wordmark"><strong>EduMind<span>AI</span></strong><small>LEARNING STUDIO</small></div>
        <button class="mobile-sidebar-close" type="button" data-close-sidebar aria-label="Close navigation">&times;</button>
    </div>
    <div class="sidebar-section-label">WORKSPACE</div>
    <nav aria-label="Student pages">
        {% set page = request.endpoint.split('.')[0] if request.endpoint else '' %}
        <a class="{{ 'active' if page == 'dashboard' else '' }}" {% if page == 'dashboard' %}aria-current="page"{% endif %} href="{{ url_for('dashboard.index') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/></svg><span>Dashboard</span></a>
        <a class="{{ 'active' if page == 'planner' else '' }}" {% if page == 'planner' %}aria-current="page"{% endif %} href="{{ url_for('planner.index') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3"/></svg><span>Study Planner</span></a>
        <a class="{{ 'active' if page == 'progress' else '' }}" {% if page == 'progress' %}aria-current="page"{% endif %} href="{{ url_for('progress.index') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9M10 18V5M16 18v-7M22 18v-4M2 21h20"/></svg><span>Progress Tracking</span></a>
        <a class="{{ 'active' if page == 'chatbot' else '' }}" {% if page == 'chatbot' %}aria-current="page"{% endif %} href="{{ url_for('chatbot.index') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="3"/><path d="m8 19-3 3v-3M8 10h8M8 14h5"/></svg><span>AI Study Coach</span><span class="nav-ai-dot" aria-hidden="true"></span></a>
        <a class="{{ 'active' if page == 'feedback' else '' }}" {% if page == 'feedback' %}aria-current="page"{% endif %} href="{{ url_for('feedback.index') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5L12 3Z"/><path d="m19 17 1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2Z"/></svg><span>Personalised Feedback</span></a>
        <a class="{{ 'active' if page == 'evaluation' else '' }}" {% if page == 'evaluation' %}aria-current="page"{% endif %} href="{{ url_for('evaluation.index') }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h8M8 17h5M8 2v4M16 2v4"/></svg><span>Evaluation</span></a>
    </nav>
    <div class="sidebar-bottom">
        <div class="sidebar-focus-card"><span class="focus-stars" aria-hidden="true">✦ &nbsp; ✧</span><strong>Small steps. Real progress.</strong><p>Show up today. Your future self will thank you.</p></div>
        <button class="theme-toggle-btn sidebar-theme-toggle" type="button" aria-label="Toggle light and dark theme"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-text">Dark Mode</span></button>
        <form method="POST" action="{{ url_for('auth.logout') }}" class="logout-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="logout-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>Sign out</span></button></form>
    </div>
</aside>
